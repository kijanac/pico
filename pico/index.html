<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbf3ea" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pico" />
    <link rel="icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Fetch the UI font with the stylesheet rather than after first layout; Vite rewrites the path. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/node_modules/@fontsource-variable/recursive/files/recursive-latin-mono-normal.woff2"
    />
    <script>
      (() => {
        const mode = localStorage.getItem("pico.theme") || "system";
        const systemDark = matchMedia("(prefers-color-scheme: dark)").matches;
        const resolved = mode === "light" ? "light" : mode === "dark" ? "dark" : systemDark ? "dark" : "light";
        document.documentElement.classList.toggle("dark", resolved === "dark");
        if (mode === "light" || mode === "dark") document.documentElement.dataset.theme = mode;
        if (localStorage.getItem("pico.palette") === "brass") document.documentElement.dataset.palette = "brass";
      })();
    </script>
    <title>Pico</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
